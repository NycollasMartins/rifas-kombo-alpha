server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # arquivos com hash no nome (vite build) podem cachear para sempre —
    # uma publicação nova gera nomes novos
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # o service worker e o manifest NUNCA podem ficar em cache: é o que
    # garante que uma publicação nova chegue em quem já instalou o app
    # (ver README, seção "Instalar na tela de início")
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
